<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive world history map: borders, wars, religions and the people who made history, year by year.">
<link rel="icon" href="favicon.svg">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>World Through Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed map with a painted sea below it and a layer of moving things above it; title, year and mode tabs
   top-left, reading panel on the right (on phones, a pop-up card only when something is picked), timeline docked at the
   bottom with play controls.
   Theme, "explorer's atlas": the world is a painted physical map (relief, deserts, forests, ice, sea depths), states are
   washes of ink over it in their flag's colour, and the chrome is a parchment atlas page in sepia ink. */
:root {
  --ocean: #8db7c9;
  --bg: #e6dcc4;
  --wave: 246 252 255;
  --wave-a: .42;
  --grat: rgba(255,255,255,.28);
  --neat: #6b5843;
  --land: #d8cfb1;
  --land-edge: #8d7a62;
  --coast: rgba(40,70,90,.55);
  --water: #8fbfd4;
  --water-edge: #5e93ad;
  --river: #4f8fb5;
  --sea-ink: #3f6f8c;
  --geo-ink: #7a5c3c;
  --ink: #2b2218;
  --ink-soft: #6a5b49;
  --paper: #f7f1e3;
  --line: #ddd0b4;
  --accent: #9b3d23;
  --war: #b3261e;
  --pol-s: 52%;
  --pol-l: 83%;
  --pol-blend: multiply;
  --pol-muted: #d9d3c6;
  --pol-edge: #6e5a47;
  --faith-op: .78;
  --sel: #1f1810;
  --shadow: 0 6px 24px rgba(60,42,20,.18);
  --era-l: 80%;
  --era-s: 30%;
  --side-op: .9;
  --terrain-filter: none;
  --sea-filter: none;
  --river-ink: #2f6a90;
  --halo: rgba(247,241,227,.55);
  --cur-warm: 192 88 58;
  --cur-cold: 40 100 165;
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ocean: #13293a; --bg: #0f1418; --wave: 170 205 225; --wave-a: .22; --grat: rgba(170,205,225,.12); --neat: #6f6553;
  --land: #2e3329; --land-edge: #4a4536; --coast: rgba(150,190,210,.35); --water: #24445a; --water-edge: #3c6a86; --river: #4f88aa;
  --sea-ink: #9cc0d4; --geo-ink: #c7a985;
  --ink: #ece3d0; --ink-soft: #a89c87; --paper: #191b1c; --line: #34352f; --accent: #e08a68; --war: #ef6a5a;
  --pol-s: 55%; --pol-l: 46%; --pol-blend: soft-light; --pol-muted: #3a3c38; --pol-edge: #d9c9a8; --faith-op: .82; --sel: #f6ecd6;
  --shadow: 0 6px 24px rgba(0,0,0,.5); --era-l: 30%; --era-s: 22%; --side-op: .85; --terrain-filter: brightness(.58) saturate(.8);
  --sea-filter: brightness(.42) saturate(.85); --river-ink: #8cc0de; --halo: rgba(12,18,22,.6); --cur-warm: 236 140 104; --cur-cold: 120 176 226;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ocean: #13293a; --bg: #0f1418; --wave: 170 205 225; --wave-a: .22; --grat: rgba(170,205,225,.12); --neat: #6f6553;
  --land: #2e3329; --land-edge: #4a4536; --coast: rgba(150,190,210,.35); --water: #24445a; --water-edge: #3c6a86; --river: #4f88aa;
  --sea-ink: #9cc0d4; --geo-ink: #c7a985;
  --ink: #ece3d0; --ink-soft: #a89c87; --paper: #191b1c; --line: #34352f; --accent: #e08a68; --war: #ef6a5a;
  --pol-s: 55%; --pol-l: 46%; --pol-blend: soft-light; --pol-muted: #3a3c38; --pol-edge: #d9c9a8; --faith-op: .82; --sel: #f6ecd6;
  --shadow: 0 6px 24px rgba(0,0,0,.5); --era-l: 30%; --era-s: 22%; --side-op: .85; --terrain-filter: brightness(.58) saturate(.8);
  --sea-filter: brightness(.42) saturate(.85); --river-ink: #8cc0de; --halo: rgba(12,18,22,.6); --cur-warm: 236 140 104; --cur-cold: 120 176 226;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
.app { position: relative; height: 100%; display: grid; grid-template-rows: 1fr auto; }
.stage { position: relative; min-height: 0; overflow: hidden; }
#sea, #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.grat { fill: none; stroke: var(--grat); stroke-width: .6; vector-effect: non-scaling-stroke; }
.neat { fill: none; stroke: var(--neat); stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.land { fill: var(--land); stroke: none; }
.terrain image { filter: var(--terrain-filter); }
.terrain image.fresh { opacity: 0; transition: opacity .5s; }
.polwrap { mix-blend-mode: var(--pol-blend); }
#sea { filter: var(--sea-filter); }
/* rivers, lakes and canals over the states; names of seas, straits, rivers, mountains and peaks */
.water path { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.water path.canal { stroke: var(--river-ink); }
.water path.lake { fill: var(--water); stroke: var(--water-edge); stroke-width: .6; }
.geo { pointer-events: none; }
.geo text { font-family: var(--f-display); text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--halo); stroke-width: 2.6px; stroke-linejoin: round; }
.geo .ocean text { fill: var(--sea-ink); opacity: .6; letter-spacing: .42em; font-size: 15px; }
.geo .sea text, .geo .sea2 text, .geo .strait text { fill: var(--sea-ink); font-style: italic; letter-spacing: .07em; }
.geo .sea text { font-size: 12.5px; }
.geo .sea2 text { font-size: 11px; }
.geo .strait text { font-size: 10.5px; text-anchor: start; }
.geo text.sub { font-size: 9px; font-style: italic; letter-spacing: .03em; opacity: .85; }
.geo .river text { fill: var(--river-ink); font-style: italic; font-size: 10.5px; letter-spacing: .05em; }
.geo .river.t1 text { font-size: 12px; }
.geo .mtn text, .geo .land text { fill: var(--geo-ink); font-size: 9.5px; letter-spacing: .32em; opacity: .9; }
.geo .land text { font-style: italic; letter-spacing: .2em; }
.geo .peak text { fill: var(--geo-ink); font-size: 10px; text-anchor: start; }
.geo .cur text { font-style: italic; font-size: 10px; letter-spacing: .05em; }
.geo .mk { pointer-events: all; cursor: help; }
.geo .mk circle.hit { fill: transparent; stroke: none; }
.pol { stroke: var(--pol-edge); stroke-width: .8; vector-effect: non-scaling-stroke; cursor: pointer; transition: fill .45s; }
.pol:hover { fill-opacity: .8; }
.pol.muted { fill: var(--pol-muted) !important; }
.pol.faith { fill-opacity: var(--faith-op); }
.pol.faith.other { fill-opacity: .16; }
.pol.sel { stroke: var(--sel); stroke-width: 2.2; }
.pol.lin { stroke: var(--sel); stroke-width: 1.3; stroke-dasharray: 5 3; }
.pol.side { fill-opacity: var(--side-op); }
.pol.minor { fill: transparent !important; stroke: none; pointer-events: none; }
.pols.old { pointer-events: none; }
.lbl { font-family: var(--f-display); fill: var(--ink); paint-order: stroke; stroke: color-mix(in srgb, var(--paper) 70%, transparent); stroke-linejoin: round; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

/* portraits: rulers beside their state's name, people where they are */
.leader, .person, .gen { cursor: pointer; }
.leader .ring, .person .ring { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.ini { font-family: var(--f-body); font-weight: 700; font-size: 10px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.leader:hover .ring, .person:hover .ring { stroke: var(--accent); stroke-width: 2.6; }
.person .ring { stroke-width: 2.2; }
.person.sel .ring { stroke: var(--accent); stroke-width: 3.2; }
.pname { font-family: var(--f-body); font-weight: 700; font-size: 11px; fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.pname tspan.d { font-weight: 400; font-style: italic; fill: var(--ink-soft); }
.trail { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .6; pointer-events: none; }
.trail.ahead { opacity: .22; }

/* faith badges beside names */
.fb { cursor: pointer; }
.fb > circle { stroke: var(--paper); stroke-width: 1.8; }
.fb.flash > circle { animation: fbflash 1.4s ease-out; }
@keyframes fbflash { 0% { stroke: #fff6c2; stroke-width: 9; } 100% { stroke-width: 1.8; } }

/* small flags over the names, in Borders */
.flag { cursor: pointer; }
.flag .halo { fill: none; stroke: var(--paper); stroke-width: 2.6; stroke-linejoin: round; opacity: .8; }
.flag .edge { fill: none; stroke: color-mix(in srgb, var(--ink) 42%, transparent); stroke-width: .7; }
.flag:hover .edge { stroke: var(--accent); stroke-width: 1.5; }
.flag .fi.new { animation: flagin .8s ease-out; }
@keyframes flagin { from { opacity: 0; } to { opacity: 1; } }

/* cities, each drawn as its landmark of the time */
.city { cursor: pointer; }
.city use { fill: color-mix(in srgb, var(--ink) 86%, transparent); stroke: color-mix(in srgb, var(--paper) 85%, transparent); paint-order: stroke; stroke-linejoin: round; }
.city:hover use { fill: var(--accent); }
.city .dot { fill: var(--ink); stroke: var(--paper); stroke-width: 1.4; }
.city .hit { fill: transparent; }
.city .tie { stroke: color-mix(in srgb, var(--ink) 55%, transparent); stroke-width: 1; }
.city.plain use { fill: color-mix(in srgb, var(--ink) 62%, transparent); }
.city use.new { animation: cityin 1s ease-out; }
@keyframes cityin { from { opacity: 0; } to { opacity: 1; } }
.city text { font-family: var(--f-display); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: color-mix(in srgb, var(--paper) 80%, transparent); stroke-width: 2.6px; stroke-linejoin: round; }
.city.r1 text { letter-spacing: .03em; }
.city.r3 text { font-style: italic; }

/* war lines, swords and battle markers */
.wl-halo { fill: none; stroke: var(--paper); stroke-linecap: round; stroke-linejoin: round; opacity: .75; pointer-events: none; }
.wl { fill: none; stroke: var(--war); stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.wl.contact { opacity: .85; }
.sw, .bm { cursor: pointer; }
.sw use { transition: transform .2s; }
.sw:hover use, .bm:hover use { transform: scale(1.25); }
.bm .pulse { fill: none; stroke: var(--war); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(.5); opacity: .95; } to { transform: scale(2.6); opacity: 0; } }
.bm.past { opacity: .55; }
.front-lbl { font-family: var(--f-mono); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-linejoin: round; letter-spacing: .04em; pointer-events: none; }

/* war overlays: arrows, generals, war names */
.move { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .92; pointer-events: none; }
.move.ghost { opacity: .22; }
.move-lbl { font-family: var(--f-body); font-style: italic; paint-order: stroke; stroke: var(--paper); stroke-linejoin: round; pointer-events: none; }
.move-lbl .cmd { font-style: normal; font-weight: 700; }
.gen .ring { stroke: var(--paper); stroke-width: 2.4; }
.gen .flag { stroke: var(--paper); stroke-width: .8; }
.gen .pole { stroke: var(--ink); stroke-width: 1.3; }
.gen:hover .ring { stroke: var(--ink); }
.wb { cursor: pointer; }
.wb text { font-family: var(--f-display); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-linejoin: round; }
.wb:hover text { fill: var(--accent); }
.mark text { font-family: var(--f-display); fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.mark.past { opacity: .45; }
.mark .dot { stroke: var(--paper); stroke-width: 1.5; }
/* migrations: a trail in the people's colour over a soft paper halo, a dashed tail while it is still being walked, and a
   round badge at the head with the people's name; little travellers move along it on the canvas above */
.mg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mg .mg-halo { stroke: var(--paper); opacity: .55; pointer-events: none; }
.mg .mg-line { pointer-events: none; }
.mg .mg-hit { stroke: transparent; pointer-events: stroke; cursor: pointer; }
.mh { cursor: pointer; }
.mh circle { stroke: var(--paper); stroke-width: 1.8; }
.mh .mh-ring { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .5; transform-box: fill-box; transform-origin: center; animation: mhpulse 2.4s ease-out infinite; }
@keyframes mhpulse { from { transform: scale(.9); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }
.mh text { font-family: var(--f-display); font-style: italic; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-linejoin: round; pointer-events: none; }
.mh:hover circle.mh-dot { stroke: var(--ink); }
#map.migmode .polwrap { opacity: .6; }
.mig-who { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mig-who .swatch { align-self: center; }
.mig-who .s { color: var(--ink-soft); font-size: 13.5px; }
.mv .face.plain svg { width: 20px; height: 20px; }
@media (prefers-reduced-motion: reduce) { .mh .mh-ring { animation: none; display: none; } }
.theater { cursor: pointer; }

/* reading panel */
.ruler { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.ruler .ph { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--line); display: grid; place-items: center; font-weight: 700; color: var(--ink-soft); }
.ruler .ph img { width: 100%; height: 100%; object-fit: cover; }
.ruler b { display: block; font-size: 16px; }
.ruler .s { color: var(--ink-soft); font-size: 13px; }
.ruler.big { grid-template-columns: 88px 1fr; }
.ruler.big .ph { width: 88px; height: 88px; font-size: 22px; }
.ruler.big b { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.hist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.hist button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; width: 100%; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.35; }
.hist button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.hist button:focus-visible { outline: 2px solid var(--accent); }
.hist .now { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.hist .swatch { width: 12px; height: 12px; margin-top: 3px; }
.hist .when { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-soft); }
.hist .note { grid-column: 2; color: var(--ink-soft); font-size: 13.5px; }
.fam h4 { margin: 4px 0 2px; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
.row button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sides { display: flex; flex-direction: column; gap: 8px; }
.sides .sd { display: grid; grid-template-columns: 14px 1fr; gap: 2px 8px; align-items: center; font-size: 14px; }
.sides .sd b { font-weight: 700; }
.sides .ld { grid-column: 2; color: var(--ink-soft); font-size: 13px; }
.mv { font-size: 14px; line-height: 1.4; display: flex; gap: 8px; align-items: center; }
.mv .face { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden; color: #fff; font-size: 10px; font-weight: 700; }
.mv .face img { width: 100%; height: 100%; object-fit: cover; }
.mv .face.plain svg { width: 16px; height: 16px; }
.ev-k { font-family: var(--f-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
.list h4 { margin: 6px 0 0; font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
.people { display: flex; flex-direction: column; gap: 4px; }
.people button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1.25; }
.people button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.people button:focus-visible { outline: 2px solid var(--accent); }
.people .face { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; background: var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.people .face img { width: 100%; height: 100%; object-fit: cover; }
.people .s { display: block; color: var(--ink-soft); font-size: 12.5px; }

.top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: calc(100% - 32px); pointer-events: none; }
.top > * { pointer-events: auto; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(20px, 2.4vw, 26px); line-height: 1; color: var(--ink-soft); }
.when { display: flex; flex-direction: column; gap: 3px; padding: 6px 14px 8px; background: color-mix(in srgb, var(--paper) 86%, transparent); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); backdrop-filter: blur(3px); min-width: 168px; }
.when .y { font-family: var(--f-display); font-size: clamp(34px, 4vw, 50px); line-height: 1; white-space: nowrap; font-variant-numeric: lining-nums; }
.when .y small { font-size: .4em; margin-left: .2em; letter-spacing: .08em; color: var(--ink-soft); }
.when .age { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--accent); white-space: nowrap; }
.when .sub { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px; box-shadow: var(--shadow); }
.tabs button { border: 0; box-shadow: none; background: transparent; padding: 6px 14px; border-radius: 6px; font-weight: 500; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.places button { padding: 5px 9px; }
button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; box-shadow: var(--shadow); }
button:hover { border-color: var(--ink-soft); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { position: absolute; top: 12px; right: 16px; bottom: 12px; width: min(380px, 34vw); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.kicker { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
.period { font-family: var(--f-display); font-size: 34px; line-height: 1.05; margin: 0; text-wrap: balance; }
.meta { margin-top: 6px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-soft); }
.panel-body { overflow-y: auto; padding: 14px 18px 18px; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.focus h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.1; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid var(--line); display: inline-block; }
.flagcard { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; margin: 12px 0 2px; }
.flagcard img { width: 96px; height: 72px; border-radius: 3px; display: block; background: var(--line); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent), 0 2px 8px rgba(40,28,12,.14); }
.flagcard b { display: block; font-size: 15px; line-height: 1.25; }
.flagcard .s { display: block; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
.flagcard .note { display: block; font-size: 13.5px; line-height: 1.38; color: var(--ink-soft); margin-top: 5px; }
.flagrow { display: flex; flex-wrap: wrap; gap: 4px; }
.flagrow button { all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 4px 3px; min-width: 44px; border-radius: 6px; cursor: pointer; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-soft); }
.flagrow button:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.flagrow button:focus-visible { outline: 2px solid var(--accent); }
.flagrow button.now { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--ink); }

.timeline { background: var(--paper); border-top: 1px solid var(--line); padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto auto 1fr auto; gap: 4px 10px; align-items: center; }

.track { position: relative; min-width: 0; }

.pop-x, .pop-grip, .tl-year, #stories { display: none; }
/* Phones: the map takes the whole screen. There is no reading panel; tapping a country (or a person, a faith or a war)
   brings up a pop-up card from the bottom that closes with its x, a swipe down or a tap on the sea. The year moves from
   the card at the top left into the timeline, which becomes a scrubber: play and the year above, a big-thumbed slider
   over a strip of era colours below, with the wars or faiths in lanes just above it. */
@media (max-width: 760px) {
  .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 48%; border-radius: 16px; display: none;
    box-shadow: 0 -2px 30px rgba(40,28,12,.28); z-index: 5; }
  .panel.pop { display: flex; animation: popup .28s cubic-bezier(.2,.8,.25,1); }
  @keyframes popup { from { transform: translateY(40px); opacity: 0; } }
  .panel.full { max-height: calc(100% - 16px); }
  .panel:not(.full):has(.tray.country) { max-height: max(48%, 288px); }   /* room for a state's whole row of stories on a short phone */
  .panel.collapsed .panel-body { display: none; }
  .panel-head { position: relative; padding: 16px 48px 10px 16px; cursor: pointer; touch-action: none; }
  .panel.collapsed .panel-head { border-bottom: 0; }
  .pop-grip { display: block; position: absolute; top: 6px; left: calc(50% - 18px); width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
  .pop-x { display: grid; place-items: center; position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0; border-radius: 50%;
    box-shadow: none; border: 0; background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); z-index: 1; }
  .pop-x svg { width: 16px; height: 16px; }
  .period { font-size: 24px; }
  .period .swatch { width: 16px; height: 16px; margin-right: 8px; vertical-align: 2px; }
  .kicker { font-size: 11px; margin-bottom: 2px; }
  .meta { margin-top: 4px; }
  .panel-body { padding: 10px 16px 16px; gap: 14px; }
  .syn { font-size: 15px; }
  .ticks span.minor, .band.short { color: transparent; }
  .tabs button { padding: 6px 8px; flex: none; font-size: 14px; }
  .tabs { max-width: calc(100vw - 132px); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .top { gap: 6px; left: 10px; max-width: calc(100% - 20px); }
  .top h1, .top > .when, .top > .row:not(.places) { display: none; }
  .places { flex-wrap: nowrap; overflow-x: auto; max-width: calc(100vw - 20px); padding: 2px 2px 8px; margin: -2px -2px -8px; scrollbar-width: none; }
  .places button { flex: none; font-size: 14px; padding: 4px 9px; box-shadow: 0 1px 4px rgba(60,42,20,.16); }
  /* a story button at the top right, where the year card was */
  #stories { display: grid; place-items: center; position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 10px; width: 44px; height: 44px;
    padding: 0; border-radius: 50%; border: 2.5px solid transparent; box-shadow: var(--shadow);
    background: linear-gradient(var(--paper), var(--paper)) padding-box, var(--story-ring) border-box; color: var(--story-a); }
  #stories svg { width: 18px; height: 18px; margin-left: 2px; }
  #stories[aria-pressed="true"] { background: var(--story-ring); color: #fff; }

  /* the timeline as a scrubber */
  .timeline { grid-template-columns: 40px 1fr 36px; gap: 2px 6px; padding: 8px 10px calc(6px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px rgba(40,28,12,.08); }
  .play { grid-row: 1; grid-column: 1; width: 40px; height: 40px; }
  .tl-head { grid-row: 1; grid-column: 2 / 4; min-height: 40px; gap: 8px; flex-wrap: nowrap; overflow: hidden; }
  .tl-head .tl-hint { display: none; }
  .tl-head > span:not(.grow):not(.tl-year) { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tl-year { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; color: var(--ink-soft); }
  .tl-year b { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--ink); font-variant-numeric: lining-nums; }
  .tl-year .ad { font-size: 12px; letter-spacing: .08em; }
  .tl-year .tl-era { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .tl-head button { flex: none; padding: 6px 10px; font-size: 13px; border-radius: 99px; }
  #back, #lineBack { padding: 6px 12px 6px 9px; }
  /* on a country's timeline the year keeps the left, and the way back sits at the right beside the speed */
  .tl-head > .tl-year { order: -2; }
  .tl-head > .grow { order: -1; }
  .step { grid-row: 2; width: 36px; height: 36px; border-radius: 50%; align-self: end; margin-bottom: 14px; }
  #prev { grid-column: 1; justify-self: center; }
  #next { grid-column: 3; }
  .track { grid-row: 2; grid-column: 2; --th: 26px; }
  .bands { height: 8px; order: 0; }
  .band { height: 6px; top: 1px; border-radius: 3px; padding: 0; font-size: 0; }
  .band.cur { box-shadow: 0 0 0 1.5px var(--ink); }
  .warbar { height: 4px; border-radius: 2px; min-width: 4px; }
  .pin { width: 14px; height: 14px; top: 1px; }
  #slider { -webkit-appearance: none; appearance: none; background: transparent; height: 34px; touch-action: none; cursor: pointer; }
  #slider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
  #slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  #slider::-moz-range-track { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
  #slider::-moz-range-progress { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  #slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); box-shadow: 0 1px 6px rgba(0,0,0,.35); }
  #slider:focus-visible { outline: none; }
  #slider:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ink); outline-offset: 1px; }
  .ticks { height: 14px; margin-top: -4px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) { .pol { transition: none; } .bm .pulse { animation: none; } .fb.flash > circle { animation: none; } }
/* stories: the most important people's lives told a page at a time, like a story on a phone. A ring round a face
   means it has one (grey once seen). The story card is dark whatever the theme, so pictures and text read the same. */
/* the story ring runs gold to coral to magenta, so it never reads as one of the single colours that mark a person's kind */
:root { --story-a: #d42f7a; --story-m: #ea5a36; --story-b: #f0aa2c; --story-ring: linear-gradient(40deg, var(--story-b), var(--story-m) 48%, var(--story-a)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --story-a: #f0559a; --story-m: #ff7a4d; --story-b: #ffc24d; } }
:root[data-theme="dark"] { --story-a: #f0559a; --story-m: #ff7a4d; --story-b: #ffc24d; }
.sring { display: none; fill: var(--paper); stroke: url(#storyRing); stroke-width: 3; pointer-events: none; }
.has-story .sring { display: inline; }
.has-story.seen .sring { stroke: color-mix(in srgb, var(--ink-soft) 60%, transparent); stroke-width: 1.7; }
.has-story:hover .sring { stroke-width: 3.8; }
/* the dates in a person's or a faith's history list are plain text, not the year card at the top left */
.hist .when, .stint .when { display: inline; padding: 0; background: none; border: 0; border-radius: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; min-width: 0; }
.tray { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin: -4px -2px -6px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.tray button { all: unset; box-sizing: border-box; flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; scroll-snap-align: start; text-align: center; }
.tray .face { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: var(--ink-soft); background: var(--line); }
.tray .face img { width: 100%; height: 100%; object-fit: cover; }
.tray .face.story { border-width: 2.5px; padding: 2px; }
.tray .n { font-size: 12px; line-height: 1.2; max-width: 66px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tray button:focus-visible .face { outline: 2px solid var(--accent); outline-offset: 2px; }
/* a state's row: under each name, the year that person was there, or "now" */
.tray .y { margin-top: -3px; font-family: var(--f-mono); font-size: 10.5px; line-height: 1.2; color: var(--ink-soft); white-space: nowrap; }
.tray .y.now { color: var(--accent); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
.face.story, .ph.story { cursor: pointer; border: 2px solid transparent; padding: 1.5px; transition: transform .15s;
  background: linear-gradient(var(--fc, var(--line)), var(--fc, var(--line))) content-box, linear-gradient(var(--paper), var(--paper)) padding-box,
    var(--story-ring) border-box; }
.face.story.seen, .ph.story.seen { background: linear-gradient(var(--fc, var(--line)), var(--fc, var(--line))) content-box, linear-gradient(var(--paper), var(--paper)) padding-box,
    linear-gradient(color-mix(in srgb, var(--ink-soft) 45%, transparent), color-mix(in srgb, var(--ink-soft) 45%, transparent)) border-box; }
.face.story img, .ph.story img { border-radius: 50%; }
.face.story:hover, .ph.story:hover { transform: scale(1.06); }
.people .face.story { width: 36px; height: 36px; margin: -3px; }
.mv .face:not(.story) { background: var(--fc, var(--line)); }
.mv .face.story { width: 32px; height: 32px; margin: -3px; }
.ruler .ph.story { width: 74px; height: 74px; margin: -5px; border-width: 3px; padding: 2px; }
.ruler.big .ph.story { width: 98px; height: 98px; }
.storybtn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 6px 15px 6px 11px; border-radius: 99px;
  cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink); border: 2px solid transparent;
  background: linear-gradient(var(--paper), var(--paper)) padding-box, var(--story-ring) border-box; }
.storybtn svg { width: 15px; height: 15px; color: var(--story-a); }
.storybtn:hover { background: linear-gradient(color-mix(in srgb, var(--story-a) 10%, var(--paper)), color-mix(in srgb, var(--story-a) 10%, var(--paper))) padding-box,
  var(--story-ring) border-box; }
.storybtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* a war's or an event's face is a rounded square (a person's is round), showing its icon until its picture loads */
.face.ev { border-radius: 13px; }
.face.ev img { border-radius: 9px; }
.tray .face.ev { border-radius: 17px; }

.sv-sides { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; margin: -4px 0 12px; font-size: 13.5px; line-height: 1.3; color: rgba(255,255,255,.88); }
.sv-sides span { display: inline-flex; align-items: center; gap: 6px; }

.sv-num { margin: 0 0 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }

.sv-body.k-scene { --kc: rgba(255,255,255,.78); }
.sv-body.k-battle { --kc: #ff9e80; }
.sv-body.k-turn { --kc: #f0c25a; }
.sv-body.k-figure { --kc: #9fd3ff; }
.sv-body.k-cost { --kc: #f4a3a3; }
.spin { pointer-events: none; }
.spin .dot { fill: var(--story-a); stroke: var(--paper); stroke-width: 2.2; }
.spin .pulse { fill: none; stroke: var(--story-a); stroke-width: 2.4; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
.spin text { font-family: var(--f-display); font-size: 16px; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }

.sv { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; font-family: var(--f-body); color: #f4f1ea; --kc: #f0c25a; }
.sv-dim { position: absolute; inset: 0; background: rgba(7, 10, 13, .86); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sv-wrap { position: relative; display: flex; align-items: center; gap: 16px; }
.sv-card { position: relative; flex: none; overflow: hidden; border-radius: 14px; background: #0f1317; box-shadow: 0 24px 70px rgba(0,0,0,.55); outline: none;
  display: flex; flex-direction: column;
  height: min(92vh, 880px); width: min(calc(100vw - 150px), calc(min(92vh, 880px) * .5625));
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
@supports (height: 1dvh) { .sv-card { height: min(92dvh, 880px); width: min(calc(100vw - 150px), calc(min(92dvh, 880px) * .5625)); } }
.sv-bg { position: absolute; inset: -60px; background: #1a2026 center / cover no-repeat; filter: blur(30px) brightness(.46) saturate(1.25); }
.sv-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: 10px 10px 30px; background: linear-gradient(rgba(0,0,0,.58), rgba(0,0,0,.22) 70%, transparent); }
.sv-bars { display: flex; gap: 3px; padding: 0 2px; }
.sv-bar { flex: 1; height: 2.5px; border-radius: 2px; background: rgba(255,255,255,.3); overflow: hidden; }

.sv-head { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
.sv-who { all: unset; display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; cursor: pointer; padding: 2px 4px; border-radius: 8px; }
.sv-av { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex: none; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 12px; font-weight: 700; box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); }
.sv-av img { width: 100%; height: 100%; object-fit: cover; }
.sv-nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }

.sv-nm span { font-family: var(--f-mono); font-size: 11px; color: rgba(255,255,255,.72); white-space: nowrap; }
.sv-ib { all: unset; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; cursor: pointer; flex: none; color: #fff; }
.sv-ib svg { width: 21px; height: 21px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
.sv-ib:hover, .sv-who:hover { background: rgba(255,255,255,.12); }
.sv-ib:focus-visible, .sv-who:focus-visible, .sv-nav:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.sv-media { position: relative; z-index: 1; flex: 1 1 0; min-height: 28%; margin-top: 70px; pointer-events: none; }

.sv-media img { position: absolute; left: 16px; top: 6px; width: calc(100% - 32px); height: calc(100% - 10px); object-fit: contain;

  // room after the last century, so that a jump to it brings its heading to the top like any other
  function dcTail() {
    const end = $('dcEnd'), secs = dcBody.querySelectorAll('.dc-c'), last = secs[secs.length - 1];
    if (end) end.style.minHeight = last ? Math.max(0, dcBody.clientHeight - last.offsetHeight) + 'px' : '';
  }
  const dcSecs = () => [...dcBody.querySelectorAll('.dc-c')].map(s => [+s.dataset.c, s]);
  // the century at the top of the list, and the one to show for a century: itself, or the nearest earlier one listed
  function dcAt() { let c = null; for (const [x, s] of dcSecs()) { if (s.offsetTop <= dcBody.scrollTop + 4 || c == null) c = x; else break; } return c; }
  function dcNear(c) { let best = null; for (const [x] of dcSecs()) { if (best == null || x <= c) best = x; else break; } return best; }
  function dcGoTo(c, smooth) {
    const s = dcBody.querySelector(`.dc-c[data-c="${c}"]`); if (!s) return;
    const top = s.offsetTop, d = top - dcBody.scrollTop, h = dcBody.clientHeight;
    if (!smooth || reduce()) return void (dcBody.scrollTop = top);
    if (Math.abs(d) > 2 * h) dcBody.scrollTop = top - Math.sign(d) * h;   // a long way: most of it at once, the rest smoothly
    dcBody.scrollTo({ top, behavior: 'smooth' });
  }
  // mark the century in view on the rail, and keep it in sight there
  function dcSpy() {
    DC.raf = 0;
    const c = dcAt();
    for (const b of dcRail.querySelectorAll('button')) {
      const on = +b.dataset.c === c;
      if (on === (b.getAttribute('aria-current') === 'true')) continue;
      if (!on) { b.removeAttribute('aria-current'); continue; }
      b.setAttribute('aria-current', 'true');
      const r = dcRail, beh = reduce() ? 'auto' : 'smooth';
      if (r.scrollWidth > r.clientWidth + 1) r.scrollTo({ left: b.offsetLeft - (r.clientWidth - b.offsetWidth) / 2, behavior: beh });
      else if (b.offsetTop < r.scrollTop || b.offsetTop + b.offsetHeight > r.scrollTop + r.clientHeight) r.scrollTo({ top: b.offsetTop - (r.clientHeight - b.offsetHeight) / 2, behavior: beh });
    }
  }
  // bring a name into view below its century's heading
  function dcShowRow(b) {
    const top = b.offsetTop, h = b.offsetHeight, head = 64;
    if (top < dcBody.scrollTop + head) dcBody.scrollTop = top - head;
    else if (top + h > dcBody.scrollTop + dcBody.clientHeight) dcBody.scrollTop = top + h - dcBody.clientHeight + 8;
  }
  const dcStill = () => [dcCard, $('dcDim')].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  const dcExpanded = on => dcL().btns.forEach(id => $(id).setAttribute('aria-expanded', String(on)));
  function dcOpen(kind) {
    const L = DCL[kind];
    if ((DC.open && DC.kind === kind) || !L.list.length) return;
    if (DC.open) dcClose(true);   // the other list
    stopPlay(); hideTip();
    DC.open = true; DC.kind = kind; DC.back = document.activeElement;
    dcStill();   // it was still closing
    $('dcKick').textContent = L.kick; $('dcTitle').textContent = L.title; $('dcSub').textContent = L.sub;
    $('dcX').setAttribute('aria-label', L.x); dcCard.dataset.list = kind;
    dcEl.hidden = false; document.querySelector('.app').inert = true;
    dcExpanded(true);
    const all = dcAll(); dcFilters(all); dcList(all);
    // back where the list was left if the map has not moved since; otherwise at the map's century
    if (L.year === S.year && L.top) dcBody.scrollTop = L.top; else dcGoTo(dcNear(centOf(S.year)));
    dcSpy();
    if (!reduce()) {
      dcCard.animate(isPhone() ? [{ transform: 'translateY(48px)', opacity: 0 }, { transform: 'none', opacity: 1 }] : [{ transform: 'scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: 260, easing: 'cubic-bezier(.2,.85,.25,1)' });
      $('dcDim').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
    }
    dcBody.focus({ preventScroll: true });
    if (!all.length) setTimeout(function wait() {   // the stories' own list was still loading
      if (!DC.open || DC.kind !== kind) return;
      const a = dcAll(); if (!a.length) return void setTimeout(wait, 300);
      dcFilters(a); dcList(a); dcGoTo(dcNear(centOf(S.year))); dcSpy();
    }, 300);
  }
  function dcClose(now) {
    if (!DC.open) return;
    DC.open = false; dcL().year = S.year; dcL().top = dcBody.scrollTop;
    dcExpanded(false);
    const done = () => {
      if (DC.open) return;   // opened again while it was closing
      dcEl.hidden = true; dcStill();
      if (!SV.open) document.querySelector('.app').inert = false;
      const b = DC.back; if (!now && b && b !== document.body && b.isConnected && b.focus) b.focus({ preventScroll: true });
    };
    if (now === true || reduce()) return done();
    dcCard.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: isPhone() ? 'translateY(40px)' : 'scale(.97)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' }).onfinish = done;
    $('dcDim').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
  }
  for (const [kind, L] of Object.entries(DCL)) L.btns.forEach(id => { $(id).onclick = () => DC.open && DC.kind === kind ? dcClose() : dcOpen(kind); });
  $('dcX').onclick = () => dcClose();
  $('dcDim').onclick = () => dcClose();
  dcFil.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'), row = b && b.closest('[data-dim]'); if (!row || b.disabled) return;
    const L = dcL(), d = L.dims.find(x => x.k === row.dataset.dim), v = b.dataset.v;
    if (!d || L.sel[d.k] === v) return;
    const at = dcAt(), lefts = [...dcFil.children].map(r => r.scrollLeft), focused = document.activeElement === b;
    L.sel[d.k] = v; toStore(d.store, v);
    const all = dcAll(); dcFilters(all);   // the other rows' counts change with it
    [...dcFil.children].forEach((r, i) => { r.scrollLeft = lefts[i] || 0; });
    if (focused) { const nb = dcFil.querySelector(`[data-dim="${d.k}"] [data-v="${v}"]`); if (nb) nb.focus({ preventScroll: true }); }
    dcList(all); dcGoTo(dcNear(at != null ? at : centOf(S.year))); dcSpy();
  });
  dcRail.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) dcGoTo(+b.dataset.c, true); });
  dcBody.addEventListener('click', e => {
    const b = e.target.closest('[data-story-person]'); if (!b) return;
    openStory(b.dataset.storyPerson, { queue: (dcBody.dataset.queue || '').split(' ').filter(Boolean), from: e });
  });
  dcBody.addEventListener('scroll', () => { if (!DC.raf) DC.raf = requestAnimationFrame(dcSpy); }, { passive: true });
  addEventListener('resize', () => { if (DC.open) { dcTail(); dcSpy(); } });
  addEventListener('keydown', e => {
    if (!DC.open || SV.open) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); dcClose(); }
    // space scrolls the list, and doesn't play the map behind it
    else if (e.key === ' ' && !(e.target.closest && e.target.closest('button, a, input, summary'))) e.stopImmediatePropagation();
  }, true);
  // a story opened from the list: when it closes, the list is still there, its rings up to date and the last story's
  // name in view. A story that sends the reader to the map (a page's place, "see them on the map", or an event story's
  // war or place) closes the list too.
  new MutationObserver(() => {
    if (!svEl.hidden || !DC.open) return;
    document.querySelector('.app').inert = true;   // closing the story woke the map behind the list
    for (const b of dcBody.querySelectorAll('.dc-p')) { const f = b.querySelector('.face'); if (f) f.classList.toggle('seen', seenStories.has(b.dataset.storyPerson)); }
    const b = SV.id && [...dcBody.querySelectorAll('.dc-p')].find(x => x.dataset.storyPerson === SV.id);
    if (b) { dcShowRow(b); b.focus({ preventScroll: true }); }
  }).observe(svEl, { attributes: true, attributeFilter: ['hidden'] });
  $('svWho').addEventListener('click', () => dcClose(true));
  svBody.addEventListener('click', e => { if (e.target.closest('[data-sv="map"], [data-sv="person"], [data-sv="war"], [data-sv="place"]')) dcClose(true); });
  // portraits that arrive while the list is open
  function dcFaces() {
    if (!DC.open) return;
    for (const b of dcBody.querySelectorAll('.dc-p')) {
      const f = b.querySelector('.face'), src = imgOf(personById[b.dataset.storyPerson]);
      if (f && src && !f.querySelector('img')) f.innerHTML = `<img src="${esc(src)}" alt="" loading="lazy">`;
    }
  }

  // ---------- start ----------
  readColors();
  const hy = +((location.hash.match(/year=(-?\d+)/) || [])[1]);
  const startYear = isFinite(hy) && hy && hy >= snaps[0].span[0] && hy <= snaps[N - 1].span[1] ? hy : 1715;
  S.year = startYear; S.idx = periodOf(startYear); S.pos = posOfYear(startYear);
  layout();
  worldView(0);
  // a phone starts on the Old World, big enough to touch, rather than the whole world in a strip
  if (isPhone()) zoomToBounds(boxBounds([-28, -38, 150, 70]), 40, 0);
  renderTimeline();
  setYear(startYear, { force: true });
  await showBorders(fileForYear(startYear));
  renderPanel();
  drawAmbient(true);
})();
</script>
